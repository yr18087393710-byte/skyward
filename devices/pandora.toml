[device]
codename = "pandora"
brand = "Xiaomi"
model = "Xiaomi 17 Pro"
ab = true
soc = { hans = "第五代骁龙®8至尊版移动平台", hant = "Snapdragon® 8 Elite Gen 5 行動平台", en = "Snapdragon® 8 Elite Gen 5 Mobile Platform" }
os_version_prop = "ro.mi.os.version.incremental"

[display]
# persist.sys.miui_resolution in the odm partition's build.prop.
width = 1220
height = 2656
density = 520

[modules]
sources = ["vendor_boot", "vendor_dlkm", "vendor", "system_dlkm"]
# The touchscreen comes from two makers: Synaptics TouchComm and FocalTech,
# both behind Xiaomi's touch layer. The phone's own modules.load lists both
# drivers, and only the one whose controller is fitted finds it. The NFC
# controller's driver makes the node the phone's NFC HAL talks to the
# secure element through, which the phone's own init loads before it.
load = ["synaptics_tcm2", "focaltech_touch", "nxp-nci"]

# As on the 17 Ultra, the controller comes back from its reset sending raw
# frames for /odm/lib64/libtouchreport.so, which a recovery runs none of;
# told through Xiaomi's touch layer, the driver has it report positions.
# That is known of the Synaptics controller; whether FocalTech's answers
# the same switch is not yet tried.
[touch]
writes = [{ path = "/sys/class/touch/touch_dev/enable_touch_raw", value = "0" }]

# The firmware of the WLAN chip is on the modem partition, which the phone
# mounts at /vendor/firmware_mnt and its own recovery leaves unmounted.
[firmware]
partition = "modem"

# The persist partition, which the phone mounts at /mnt/vendor/persist and
# its own recovery leaves unmounted. The WLAN's MAC address is there.
[partitions]
mounted = ["persist"]

# Its stock recovery leaves out libsysutils and libcap, which the
# recovery's own logd loads, as the 17 Ultra's does.
[logd]
libraries = ["/mnt/system/system/lib64/libsysutils.so", "/mnt/system/system/lib64/libcap.so"]

# What the phone's own init runs once the system has finished starting, as
# kernel-post-boot in /vendor/etc/init/hw/init.qti.kernel.rc. The kernel
# starts both CPU clusters on the performance governor, which holds them at
# their highest clock, and Qualcomm's idle driver keeps idle CPUs from
# powering down until it is told otherwise; the script hands the clusters
# to WALT, lets idle CPUs power down and sets how the memory bus scales.
# Without it the CPUs stay at their highest clock and voltage even while
# idle, and the phone slowly heats up.
[[service]]
path = "/vendor/bin/sh"
args = ["/vendor/bin/init.kernel.post_boot.sh"]
libraries = ["/system/lib64", "/vendor/lib64"]
oneshot = true
user = "root"
groups = ["root", "system", "wakelock", "graphics"]

# The secure world's programs, in the order the installed system's init
# starts them; without them nothing can use a key the phone wrapped in
# hardware, and the data partition cannot be opened. The 17 Ultra's vendor
# partition is this phone's file for file, so it names the same programs.

# The secure world reaches back into Android through the listeners this
# daemon registers; without them the key service cannot use any key.
[[service]]
path = "/vendor/bin/qseecomd"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_property = "vendor.sys.listeners.registered"
user = "root"
groups = ["root", "drmrpc"]

# The opener the secure world's apps are reached through by programs that
# speak to them as GlobalPlatform's TEE client does, which loads those apps
# from /vendor/firmware_mnt/image as they are first asked for.
[[service]]
path = "/vendor/bin/hlosminkdaemon"
libraries = ["/system/lib64", "/vendor/lib64"]
user = "system"
groups = ["system", "oem_2912", "wakelock"]
capabilities = ["WAKE_ALARM", "BLOCK_SUSPEND"]

# The key service, which is the only thing that can use the keys the phone
# wrapped in hardware. The same program serves the secure clock and the
# shared secret, which the phone describes apart from it.
[[service]]
path = "/vendor/bin/hw/android.hardware.security.onekeymint-service-qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_service = "android.hardware.security.keymint.IKeyMintDevice/default"
registers = [
    "android.hardware.security.keymint.IRemotelyProvisionedComponent/default",
    "android.hardware.security.secureclock.ISecureClock/default",
    "android.hardware.security.sharedsecret.ISharedSecret/default",
]
user = "system"
groups = ["system", "drmrpc"]

# The credential service: it is what the secure world has check the secret
# behind a screen lock, and the only thing that can hand out the note the
# key service wants before it will use a key that secret guards.
[[service]]
path = "/vendor/bin/hw/android.hardware.gatekeeper-rust-service-qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_service = "android.hardware.gatekeeper.IGatekeeper/default"
user = "system"
groups = ["system"]

# The secure element: the phone's embedded one, which its own programs
# reach through the HAL its vendor partition carries. The weaver's slots are
# in it, so it runs before the weaver. It reaches the chip through the node
# the NFC controller's driver makes, so that module is loaded first.
[[service]]
path = "/vendor/bin/hw/android.hardware.secure_element-service.qti"
libraries = ["/system/lib64", "/vendor/lib64", "/vendor/lib64/hw", "/odm/lib64", "/mnt/system/system/lib64", "/mnt/system/system/lib64/bootstrap"]
ready_service = "android.hardware.secure_element.ISecureElement/eSE1"
user = "system"
groups = ["nfc", "system"]

# The service the weaver asks the secure element's applets through. Android
# keeps it in its framework, which a recovery runs none of: the installed
# system answers it from com.android.se, a program of its own that only a
# running framework starts. The recovery runs its own se_omapi instead, one
# built to run here with init's seclabel, staged out of the persist
# partition into the recovery's own root, where it can be given a mode.
#
# It is started without being waited on. A program that registers nothing
# would hold up every program after it for the whole ready timeout, and the
# weaver is what has to run: left to itself, the weaver starts, fails while
# no service answers, and is started again, so it meets the service as soon
# as the service is there.
[[service]]
path = "/vendor/bin/sh"
args = ["-c", "mkdir -p /opt/se; d=/mnt/vendor/persist/se; [ -d $d ] || d=/persist/se; for f in se_omapi android.se.omapi-V1-ndk.so libQSEEComAPI.so; do if [ -f $d/$f ]; then cp -f $d/$f /opt/se/$f; fi; done; chmod 0755 /opt/se/se_omapi 2>/dev/null; true"]
libraries = ["/system/lib64", "/vendor/lib64"]
oneshot = true
user = "root"
groups = ["root"]

[[service]]
path = "/opt/se/se_omapi"
libraries = ["/opt/se", "/system/lib64", "/vendor/lib64", "/odm/lib64", "/vendor/lib64/hw", "/mnt/system/system/lib64", "/mnt/system/system/lib64/bootstrap"]
# Named for the description the directory needs of it, not for waiting on
# it: a program is waited on before the programs after it are started, and
# the weaver must be started whether or not this one has registered yet.
registers = ["android.se.omapi.ISecureElementService/default"]

# What the service directory holds once the two are given their moment,
# written where the running system can read it: the next start is set by
# what it says, and a service that never registered says so here rather
# than in a timeout that stops the programs behind it.
[[service]]
path = "/vendor/bin/sh"
args = ["-c", "sleep 4; { LD_LIBRARY_PATH=/mnt/system/system/lib64:/mnt/system/system/lib64/bootstrap /mnt/system/system/bin/service list; } > /mnt/vendor/persist/service-list.txt 2>&1; true"]
libraries = ["/system/lib64", "/vendor/lib64"]
oneshot = true
user = "root"
groups = ["root"]

# The weaver, in the phone's NXP secure element, behind the program the
# installed system's init enables as vendor.weaver_nxp. Every user's secret
# is bound to a slot of it, with a screen lock or without, so without it
# none of the users' own files open. It runs as root: its own libraries ask
# for the installed system's libvndksupport, which the linker only searches
# for a program that does not change its user.
[[service]]
path = "/odm/bin/hw/android.hardware.weaver-service.nxp-qti"
libraries = ["/system/lib64", "/vendor/lib64", "/odm/lib64", "/mnt/system/system/lib64", "/mnt/system/system/lib64/bootstrap"]
ready_service = "android.hardware.weaver.IWeaver/default"

# WLAN: Qualcomm's Peach on PCIe (qcom,cnss-peach in its dtbo), as on the
# 17 Ultra, whose vendor partition this phone shares file for file but for
# its build properties, a power hint and two radio libraries.
[wlan]
modules = ["rfkill", "qca_cld3_peach_v2"]
writes = [{ path = "/sys/kernel/cnss/fs_ready", value = "1" }]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/system/lib64", "/vendor/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"

# The update server the stock updater of the Chinese system asks.
[update]
server = "https://update.miui.com/updates/miotaV3.php"

# The stock build the recovery is made on: the Chinese system's OS4.0.4.0,
# whose full update package on the phone maker's own download server holds
# the recovery partition the recovery is built on top of.
[stock]
version = "OS4.0.4.0.XBLCNXM"
package = "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS4.0.4.0.XBLCNXM/pandora-ota_full-OS4.0.4.0.XBLCNXM-user-17.0-8b5f4d5781.zip"
recovery = "98aa593c95e9cd3a79f9cbd95f49e240f9dda482640083a3e89ff4d3164d0852"

# qcom-hv-haptics (qcom,hv-haptics in its dtbo), with the click made from
# samples at the motor's resonant frequency as on the 17 Ultra. The
# strengths are the 17 Ultra's, which were felt on that phone's motor.
[haptics]
resonance = "/sys/class/qcom-haptics/lra_frequency_hz"
strength = { lightest = 0.25, strongest = 0.75 }
